[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tsla-market-impact"
version = "0.1.0"
description = "Chronological TSLA market-impact study using LOBSTER event data"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Riad Darwish" },
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "scikit-learn>=1.4",
  "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[project.scripts]
tsla-impact = "tsla_market_impact.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tsla_market_impact"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
